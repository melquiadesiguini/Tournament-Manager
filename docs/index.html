    <script type="text/javascript">
      // Soporte de rutas para SPA en GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // Restaura la ruta real que 404.html codificó en la query string.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>

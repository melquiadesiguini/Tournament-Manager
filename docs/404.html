<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tournament Manager</title>
    <script type="text/javascript">
      // Soporte de rutas para SPA en GitHub Pages: https://github.com/rafgraph/spa-github-pages
      // GitHub Pages sirve este archivo para cualquier ruta que no exista como archivo real
      // (por ejemplo /Tournament-Manager/kumite). Redirige a index.html codificando la ruta
      // original en la query string para que el script en index.html la restaure.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      )
    </script>
  </head>
  <body></body>
</html>
